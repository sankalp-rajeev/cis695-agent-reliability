# V4 test generation runs in a fresh base-commit container with network off and
# both package-cache masks. Only the listed requirements' test files are read out.
# Generation limits are supplied by the verifier.
agent:
  system_template: |
    You are a helpful assistant that can interact with a computer shell to write tests for a bug report.
  instance_template: |
    <issue>
    {{task}}
    </issue>

    <requirements>
    {{requirements}}
    </requirements>

    <instructions>
    The repository in /testbed is checked out at the commit where the issue was
    reported. Write exactly one standalone Python script for each listed
    requirement at /testbed/v4_repro/test_repro_<ID>.py. For example, use
    /testbed/v4_repro/test_repro_R1.py for R1. Each script must assert only its
    corresponding requirement. Do not fix the problem or modify any existing file.

    Each script must assert the correct behaviour so that it fails with
    AssertionError on the current code and exits zero once the issue is fixed.
    If the problem is an unwanted exception, catch it and raise AssertionError.

    Keep each script self-contained and deterministic. Import only repository
    code, the standard library, and already installed packages. Configure any
    framework settings inside the script. Do not depend on files you created,
    other tests, randomness, or network access. Finish within 60 seconds.
    Write plain scripts and use no test framework to run them.

    Run every script twice yourself, using this command with its actual ID:

        cd /testbed && PYTHONPATH=/testbed python v4_repro/test_repro_R1.py

    Confirm each fails with AssertionError both times before submitting.
    Passing scripts, non-assertion errors, nondeterminism, and timeouts are discarded.

    Every response must contain reasoning text and at least one bash tool call.
    Use non-interactive commands. Each command runs in a new subshell, so cd and
    environment variables do not persist. Keep command output short.

    After checking every script, submit with exactly this command on its own:

        echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT

    You cannot run anything after submitting.
    </instructions>
  step_limit: 80
  cost_limit: 1.0
environment:
  cwd: /testbed
  timeout: 60
  interpreter:
  - bash
  - -c
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
    BASH_ENV: /root/.bashrc
  environment_class: docker
  run_args:
  - --rm
  - --network
  - none
  - --tmpfs
  - /opt/miniconda3/pkgs
  - --tmpfs
  - /root/.cache/pip
model:
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long. Use head, tail, sed or a more selective grep.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif %}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with exactly one bash tool call.
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    Every response needs to use the 'bash' tool at least once. Call it with your command as the argument: {"command": "your_command_here"}

    When you are done, submit with: echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    {%- endif %}
  model_kwargs:
    drop_params: true
    temperature: 0.0
