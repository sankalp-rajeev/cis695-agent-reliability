agent:
  system_template: 'You are a helpful assistant that can interact with a computer
    shell to write tests for a bug report.

    '
  instance_template: "<issue>\n{{task}}\n</issue>\n\n<instructions>\n# Task\n\nThe\
    \ repository in /testbed is checked out at the commit where the issue above\n\
    was reported, so the problem it describes is present. Your job is to write\nreproduction\
    \ tests for it. Do NOT fix the problem, and do not modify any\nexisting file:\
    \ every change outside v4_repro/ is discarded.\n\nWrite between one and three\
    \ standalone Python scripts, at exactly these paths:\n\n    /testbed/v4_repro/test_repro_1.py\n\
    \    /testbed/v4_repro/test_repro_2.py\n    /testbed/v4_repro/test_repro_3.py\n\
    \nEach script must:\n\n- assert, with `assert` statements, the CORRECT behaviour\
    \ the issue asks for,\n  so that it fails with AssertionError on the current code\
    \ and exits 0 once\n  the issue is fixed. If the problem is an unwanted exception,\
    \ catch that\n  exception and raise AssertionError instead.\n- be self-contained:\
    \ import only the repository's own code, the standard\n  library, and packages\
    \ already installed. Do not read any other file you\n  created. Configure any\
    \ framework settings the code needs inside the script.\n- be deterministic, need\
    \ no network (there is none), and finish within 60 seconds.\n- be a plain script,\
    \ not a pytest module; it is not run under pytest.\n\nEach script is run exactly\
    \ like this, twice:\n\n    cd /testbed && PYTHONPATH=/testbed python v4_repro/test_repro_N.py\n\
    \nRun each script that way yourself and confirm it fails with AssertionError\n\
    before you submit. A script is discarded if it passes on the current code, if\n\
    it fails any other way (ImportError, SyntaxError, a TypeError before the\nassertion,\
    \ a timeout), or if its two runs disagree.\n\n## Command execution\n\nEvery response\
    \ must contain reasoning text and at least one bash tool call.\nEach command runs\
    \ in a new subshell, so `cd` and environment variables do not\npersist between\
    \ commands. Use non-interactive commands only. Keep command\noutput short; use\
    \ head, tail, sed or grep to view parts of large files.\n\n## Submission\n\nWhen\
    \ the scripts are written and you have run each one, submit with exactly\nthis\
    \ command, on its own:\n\n    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT\n\nYou\
    \ cannot run anything after submitting.\n</instructions>\n"
  step_limit: 40
  cost_limit: 1.0
environment:
  cwd: /testbed
  timeout: 60
  interpreter:
  - bash
  - -c
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
    BASH_ENV: /root/.bashrc
  environment_class: docker
  run_args:
  - --rm
  - --network
  - none
  - --tmpfs
  - /opt/miniconda3/pkgs
  - --tmpfs
  - /root/.cache/pip
model:
  observation_template: '{% if output.exception_info -%}

    <exception>{{output.exception_info}}</exception>

    {% endif -%}

    <returncode>{{output.returncode}}</returncode>

    {% if output.output | length < 10000 -%}

    <output>

    {{ output.output -}}

    </output>

    {%- else -%}

    <warning>

    The output of your last command was too long. Use head, tail, sed or a more selective
    grep.

    </warning>

    {%- set elided_chars = output.output | length - 10000 -%}

    <output_head>

    {{ output.output[:5000] }}

    </output_head>

    <elided_chars>

    {{ elided_chars }} characters elided

    </elided_chars>

    <output_tail>

    {{ output.output[-5000:] }}

    </output_tail>

    {%- endif %}

    '
  format_error_template: '{% if finish_reason is defined and (finish_reason == "length"
    or (finish_reason == "tool_calls" and not has_tool_calls)) -%}

    Your previous response reached the output token limit (finish_reason={{ finish_reason
    }}) before you produced a tool call, so it was cut off. Respond more concisely
    and finish with exactly one bash tool call.

    {%- else -%}

    Tool call error:


    <error>

    {{error}}

    </error>


    Every response needs to use the ''bash'' tool at least once. Call it with your
    command as the argument: {"command": "your_command_here"}


    When you are done, submit with: echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT

    {%- endif %}

    '
  model_kwargs:
    drop_params: true
    temperature: 0.0
  model_class: reliability.umgpt.UMModel
  umgpt_config: configs/model/generator_umgpt.yaml
