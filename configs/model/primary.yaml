# Model layer. The exact model id is provenance-critical: a silent provider-side
# upgrade would invalidate cross-run comparison, so the id is pinned to a concrete
# snapshot rather than a floating alias, and recorded in every run's meta.yaml.
layer: model
role: primary

# DECIDED 2026-09-29: open-weight. DeepSeek V4 Flash via LiteLLM's native
# `deepseek/` route, which reads DEEPSEEK_API_KEY.
#
# Open weights matter here beyond cost. The study's claim is about an agent's
# self-assessment, and a model whose weights can be re-obtained keeps the
# apparatus reproducible after a provider retires an endpoint — which is not
# hypothetical: the Gemini 2.0 and 2.5 families were withdrawn mid-project and
# took the Phase 3.1 smoke configuration with them.
provider: deepseek
model_id: deepseek/deepseek-v4-flash
api_key_env: DEEPSEEK_API_KEY

# VERIFICATION STATUS: verified 2026-09-29 by a live tool-calling request.
# The model responded with a well-formed `bash` tool call, finish_reason
# tool_calls, 308 in / 54 out tokens.
#
# Appearing in litellm's cost map is NOT evidence a model serves. gemini-2.5-flash
# was present in both litellm's cost map and the provider's own ListModels
# response while returning 404 on a real request, which is why this block is
# written only by scripts/verify_model.py after an actual request succeeds, and
# never by hand. Re-run it if the pin changes.
verified:
  status: ok
  method: scripts/verify_model.py
  checked: 2026-09-29
  model_id: deepseek/deepseek-v4-flash
  tool_calling: true

# mini-swe-agent's LitellmModel sends tools=[BASH_TOOL] on every request, so
# function calling is mandatory, not optional. This is the first thing the
# verification script checks.
requires_tool_calling: true

# Deterministic decoding for the main study. Temperature is recorded per run;
# if sampling k patches per task is adopted after the pilot (see Phase 10.3),
# this becomes the only value that changes.
temperature: 0.0
top_p: 1.0
max_output_tokens: 8192

model_kwargs:
  # litellm drops provider-unsupported params rather than erroring.
  drop_params: true

# Hard ceilings so a runaway trajectory cannot silently consume the budget.
limits:
  # 50 -> 100 before pilot_12. All four pilot_11 step-limit stops (django-14725,
  # matplotlib-26113, pylint-6386, sphinx-10449) had edited and were testing when
  # they hit 50, with no repeated commands. The run records this value in
  # provenance as `max_steps`; scripts/run_pilot.py reads it from here.
  max_steps: 100
  max_input_tokens_per_task: 400000
  # Lowered from 5.00 before either half. pilot_15's agent mean was $0.059
  # and its dearest task was $0.125, so $0.50 still clears the observed
  # repair spend without leaving the old $5 ceiling in place.
  max_cost_usd_per_task: 0.50
  request_timeout_s: 600
