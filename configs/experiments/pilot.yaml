# Experiment layer: the 10-task pilot (Phase 9).
#
# Composes one config from each other layer. Nothing here may be changed mid-run;
# a changed value means a new experiment id, not an amended one.
layer: experiment
experiment_id: pilot_10

benchmark:
  dataset: SWE-bench/SWE-bench_Verified
  split: test
  manifest: manifests/pilot.csv

agent: configs/agent/swebench_claim.yaml
model: configs/model/primary.yaml
verifiers:
  - configs/verifier/full.yaml
  - configs/verifier/baseline.yaml

sampling:
  n_tasks: 10
  seed: 695
  # Stratify across repository and task type. Selection must not consider known
  # model performance on an instance (Phase 2.3).
  stratify_by: [repo, task_type]
  min_distinct_repos: 3

execution:
  single_pass: true
  retries: 0
  # Gates from Phase 9. Falling below these means fix and rerun, not analyse.
  gates:
    min_completed_without_infra_failure: 8
    min_parseable_claims: 9
    min_resolved_claims: 4
