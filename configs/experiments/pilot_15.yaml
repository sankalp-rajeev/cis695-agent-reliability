# Experiment layer: the 10-task pilot under verifier v1.2.2.
#
# pilot_14 ran under v1.2.1, whose V4 classifier dropped six real assertion
# failures (astropy-12907, sphinx-10449); a run spanning two policy versions is
# not citable, so this is a full rerun, not a partial one. It reuses no earlier
# id. Nothing here may be changed mid-run.
layer: experiment
experiment_id: pilot_15

benchmark:
  dataset: SWE-bench/SWE-bench_Verified
  split: test
  manifest: manifests/pilot.csv

agent: configs/agent/swebench_claim.yaml
model: configs/model/primary.yaml
reproduction_generator: configs/model/generator.yaml
verifiers:
  - configs/verifier/full.yaml
  - configs/verifier/baseline.yaml

sampling:
  n_tasks: 10
  seed: 695
  stratify_by: [repo, task_type]
  min_distinct_repos: 3

execution:
  single_pass: true
  retries: 0
  gates:
    min_completed_without_infra_failure: 8
    min_parseable_claims: 9
    min_resolved_claims: 4
