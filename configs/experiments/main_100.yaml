# Experiment layer: the 100-task main study.
#
# Drawn to exclude every pilot_14/pilot_15 instance: the verifier's selection
# policy, V4's budget, and the v1.3.0 decision rule were all tuned looking at
# those ten tasks (docs/checklist.md, 2026-10-05), so including them here would
# measure the tuning rather than test it. manifests/main_100.csv is a fresh,
# independently seeded stratified draw from the remaining 490 instances (seed
# 20261005, deliberately not 695, drawn before any task in it was run or
# scored). Verified disjoint from manifests/pilot.csv by set difference.
#
# NOT LAUNCHED AS ONE RUN. Split, before any task in it was scored, into
# manifests/main_50_a.csv and manifests/main_50_b.csv (seed 20261007, 10 tasks
# of each bug type per half). Launch those: configs/experiments/main_50_a.yaml
# then main_50_b.yaml. Do not launch this file.
layer: experiment
experiment_id: main_100

benchmark:
  dataset: SWE-bench/SWE-bench_Verified
  split: test
  manifest: manifests/main_100.csv

agent: configs/agent/swebench_claim.yaml
model: configs/model/primary.yaml
reproduction_generator: configs/model/generator.yaml
verifiers:
  - configs/verifier/full.yaml
  - configs/verifier/baseline.yaml

sampling:
  n_tasks: 100
  seed: 20261005
  stratify_by: [repo, task_type]
  min_distinct_repos: 3
  exclude_manifest: manifests/pilot.csv

execution:
  single_pass: true
  retries: 0
  # Scaled x10 from pilot_15's gates (8/10, 9/10, 4/10), unvalidated at this
  # size. Revisit after the 3-worker calibration (below) if its 6-task sample
  # suggests the pilot's rates do not hold at n=100.
  gates:
    min_completed_without_infra_failure: 80
    min_parseable_claims: 90
    min_resolved_claims: 40

# The start gate is the measured per-task mean times n times 1.5
# (src/reliability/billing.py). It is not a $600 ceiling.
billing_guard:
  provider_balance_endpoint: "https://api.deepseek.com/user/balance"
  start_threshold: "measured_mean * n * 1.5"
  measured_mean_usd_per_task: 0.084863757
