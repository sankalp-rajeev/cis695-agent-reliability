# Baseline verifier condition (Phase 7.2): integrity + regression only.
#
# This is the comparison that isolates what the static/build layer actually adds.
# It shares the full policy's settings for the layers it keeps, so any difference
# in outcome is attributable to the disabled layer rather than to drift.
layer: verifier
policy_version: v1.0.0-baseline

integrity:
  must_apply_to_base: true
  reject_conflict_markers: true
  reject_binary_blobs: true
  reject_harness_file_edits: true
  reject_test_deletion_or_weakening: true
  reject_unexpected_config_edits: true

regression:
  selection_policy: docs/VERIFIER_POLICY.md
  consult_pass_to_pass: false
  timeout_s: 900
  outcomes: [PASS, FAIL, ERROR, TIMEOUT, NOT_AVAILABLE]

static:
  enabled: false

risk_features: []
