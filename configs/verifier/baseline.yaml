# Baseline verifier condition (Phase 7.2): integrity + regression only.
#
# This is the comparison that isolates what the static/build layer actually adds.
# It shares the full policy's settings for the layers it keeps, so any difference
# in outcome is attributable to the disabled layer rather than to drift.
layer: verifier
policy_version: v1.2.1-baseline

integrity:
  must_apply_to_base: true
  reject_conflict_markers: true
  reject_binary_blobs: true
  reject_harness_file_edits: true
  reject_test_deletion_or_weakening: true
  reject_unexpected_config_edits: true

regression:
  selection_policy: docs/VERIFIER_POLICY.md
  consult_pass_to_pass: false

  # Selection tiers, per VERIFIER_POLICY.md §3.3 and the decision recorded
  # against §8 open question 1. Tier 0 runs the whole suite: it maximises
  # evidence but also maximises overlap with PASS_TO_PASS, which makes the
  # regression signal hardest to tell apart from half the oracle's criterion.
  # Capped at Tier 2 for interpretive cleanliness; Tier 0 stays available as a
  # flag so the ablation needs no code change.
  enable_tier0: false
  max_tier: 2

  # VERIFIER_POLICY.md §5.3 — tests written by the agent are its own claim about
  # correctness, not independent evidence.
  exclude_agent_authored_tests: true

  # §3.1. Seeded random sample across the whole tree; best-scoring layout wins
  # with no hit-rate floor, and every layout's score is recorded.
  convention_sample_size: 200
  convention_seed: 695

  # §3.4: five minutes per pass, ten per instance including the baseline.
  per_pass_timeout_s: 300
  per_instance_timeout_s: 600

  # §3.2. Only pass-to-fail transitions count as regressions; the baseline is
  # cached per instance because the base commit never changes, which also keeps
  # ablations comparable by holding the baseline fixed across them.
  baseline_pass: true
  baseline_cache_dir: runs/_baseline_cache

  # §4.1 — a flaky rejection would land in the false-rejection rate.
  rerun_flaky: true

  # §4. NOT_RUN and TIMEOUT are never counted as passes.
  outcomes: [PASS, REGRESSION, PRE_EXISTING_FAIL, NEWLY_PASSING, FLAKY, ERROR, TIMEOUT, NOT_RUN]
  signals: [PASS, FAIL, NOT_AVAILABLE, BASELINE_UNRELIABLE]

static:
  enabled: false

# Phase 7.2. Not the full policy with layers switched off: the baseline does not
# require an issue-specific signal, so it can ACCEPT evidence the full policy
# only FLAGs. That asymmetry is the measurement — a weaker verifier accepting
# more is the false-acceptance difference the study exists to quantify.
#
# It ignores the static and reproduction signals outright rather than reading
# them as NOT_AVAILABLE, so enabling those layers later cannot perturb baseline
# decisions and invalidate the comparison.
decision:
  policy: baseline
  reject_if: [patch_does_not_apply, integrity_failed, regression_failed, prohibited_manipulation]
  accept_if: [integrity_pass, regression_pass]
  otherwise: FLAG
  ignores: [static, reproduction, high_severity_risk]

risk_features: []
