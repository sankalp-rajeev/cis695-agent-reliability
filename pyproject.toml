[project]
name = "cis695-agent-reliability"
version = "0.1.0"
description = "Execution-grounded selective verification for LLM software-repair agents"
authors = [{ name = "Sankalp Rajeev" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # Experimental apparatus: pinned exactly so oracle and agent behaviour cannot
    # drift between the pilot and the frozen main study.
    "swebench==5.0.2",
    "mini-swe-agent==2.4.6",
    # Benchmark loading and sandboxing
    "datasets>=5.0.1",
    "docker>=7.1.0",
    # Model access
    "litellm>=1.100.1",
    # Configs, run manifests, and record schemas
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    # Verifier: patch integrity, static checks, regression execution
    "unidiff>=1.0.0",
    "ruff>=0.14",
    "mypy>=1.14",
    "pytest>=8.3",
    # Analysis and reporting
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.15.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tabulate>=0.9",
    # CLI and run ergonomics
    "typer>=0.15",
    "rich>=13.9",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "pytest-cov>=6.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The suite is entirely function-based. Disabling class collection stops pytest
# trying to collect domain types whose names legitimately begin with "Test"
# (TestResult, TestStatus, TestExecutor in the verifier), which it would
# otherwise warn about on every run. Renaming those to suit the test runner
# would be the tail wagging the dog.
python_classes = []
filterwarnings = ["error::pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
